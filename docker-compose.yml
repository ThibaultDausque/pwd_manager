name: pwd_manager

services:
  front:
    image: nextjs_front
    init: true
    working_dir: /front
    ports:
      - 3000:3000
    environment:
      - TZ=Europe/France
    command: npm run dev

  back:
    image: django_back
    init: true
    working_dir: /back
    ports:
      - 8000:8000
    environment:
      - TZ=Europe/France

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - back